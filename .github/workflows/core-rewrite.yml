# Isolated rewrite checks. This workflow never updates main, services, releases, or live state.
name: Core rewrite
on:
  push:
    branches: [work/301-build-shepherdr-2-1-on-core]
    paths:
      - 'server/core/**'
      - 'server/common/**'
      - 'server/demo/**'
      - 'server/main.ts'
      - 'package.json'
      - 'server/plugin-api.ts'
      - 'scripts/build-plugins.ts'
      - 'test/plugins.test.ts'
      - 'helper/core-*.ts'
      - 'bin/shepherdr'
      - 'server/app.ts'
      - 'server/frame.ts'
      - 'server/artifact-check.ts'
      - 'server/activity.ts'
      - 'server/automations.ts'
      - 'server/health.ts'
      - 'server/heartbeat.ts'
      - 'server/voice.ts'
      - 'server/live/voice.ts'
      - 'plugins/voice/**'
      - 'test/voice.test.ts'
      - 'test/layout-voice.test.ts'
      - 'server/live/heartbeat.ts'
      - 'server/live/health.ts'
      - 'plugins/health/**'
      - 'test/health.test.ts'
      - 'server/live/automations.ts'
      - 'server/common/trigger.ts'
      - 'test/layout-automations.test.ts'
      - 'server/live/activity.ts'
      - 'server/live/artifacts.ts'
      - 'server/source.ts'
      - 'shared/types.ts'
      - 'shared/models.ts'
      - 'server/common/models.ts'
      - 'plugins/chat/**'
      - 'plugins/worktree/**'
      - 'plugins/terminal/**'
      - 'plugins/browser/**'
      - 'shared/browser.ts'
      - 'server/browser-pick.ts'
      - 'server/browser-pick.ts'
      - 'test/browser.test.ts'
      - 'plugins/tasks/**'
      - 'plugins/places/**'
      - 'shared/order.ts'
      - 'test/order.test.ts'
      - 'test/layout-places.test.ts'
      - 'test/layout-sections.test.ts'
      - 'src/kernel.ts'
      - 'src/unread.ts'
      - 'src/attention.ts'
      - 'shared/attention.ts'
      - 'plugins/keyboard/**'
      - 'test/layout-search.test.ts'
      - 'test/layout-unread.test.ts'
      - 'test/layout-attention.test.ts'
      - 'test/layout-cards.test.ts'
      - 'src/restart.tsx'
      - 'shared/alerts.ts'
      - 'test/layout-restart.test.ts'
      - 'test/layout-keyboard.test.ts'
      - 'test/layout-pr-checks.test.ts'
      - 'test/layout-activity.test.ts'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'test/core-*.test.ts'
      - 'test/activity.test.ts'
      - 'test/artifacts.test.ts'
      - 'test/models.test.ts'
      - '.github/workflows/core-rewrite.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: core-rewrite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    if: github.ref == 'refs/heads/work/301-build-shepherdr-2-1-on-core'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
        env:
          SHEPHERDR_HOME: ${{ runner.temp }}/shepherdr-core-rewrite
      - run: bun test test/core-*.test.ts test/artifacts.test.ts test/models.test.ts test/activity.test.ts test/order.test.ts test/health.test.ts test/plugins.test.ts test/search.test.ts test/attention.test.ts
        env:
          SHEPHERDR_HOME: ${{ runner.temp }}/shepherdr-core-plugins

  task-layout:
    if: github.ref == 'refs/heads/work/301-build-shepherdr-2-1-on-core'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: core-rewrite-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun x playwright-core install --only-shell chromium
      - run: bun test test/layout-restart.test.ts test/layout-keyboard.test.ts test/layout-activity.test.ts test/layout-pr-checks.test.ts test/layout-places.test.ts test/layout-sections.test.ts test/layout-automations.test.ts test/layout-voice.test.ts test/layout-search.test.ts test/layout-unread.test.ts test/layout-attention.test.ts test/layout-cards.test.ts test/browser.test.ts test/voice.test.ts
        env:
          SHEPHERDR_HOME: ${{ runner.temp }}/shepherdr-core-layout

  production-plugin:
    if: github.ref == 'refs/heads/work/301-build-shepherdr-2-1-on-core'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test --isolate test/core-plugin-production.test.ts
        env:
          SHEPHERDR_REAL_PLUGIN_BUILD: '1'
          SHEPHERDR_HOME: ${{ runner.temp }}/shepherdr-production-plugin
