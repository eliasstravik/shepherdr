# Shepherdr 3.0's check on GitHub's runners, on every pull request to main and every push to main (a merge). A task
# waits for its pull request's run before it merges. A branch with no pull request can still be checked by hand:
# gh workflow run check.yml --ref <branch>.
#
# One lean job (GitHub bills by the minute): the shared lib copies, every mod's JavaScript parsed, the TypeScript
# helpers built, the Python compiled, the repo's own rules (test_repo), the installer against throwaway roots
# (test_install: install, again, update, clash, adopt, uninstall, dry run) and herdr-task's commands.
# herdr-app check needs Herdr's window runtime, which a runner doesn't have: mods are checked on a person's machine.
name: Check

on:
  # no paths-ignore here: a docs-only pull request must report a check too, or it could never merge
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: shared lib copies match lib/
        run: python3 bin/sync-shared --check
      - name: JavaScript parses
        run: |
          fail=0
          for f in $(find mods lib -name '*.js'); do
            node --input-type=module --check < "$f" || { echo "::error file=$f::doesn't parse"; fail=1; }
          done
          exit $fail
      - name: TypeScript helpers build
        run: |
          for f in $(find mods -name '*.ts'); do
            bun build --no-bundle --target bun "$f" > /dev/null || exit 1
          done
      - name: JSON parses
        run: for f in keys.json layouts/*.json lib/addons.json $(find mods -name '*.json'); do python3 -m json.tool "$f" > /dev/null || exit 1; done
      - name: shell scripts parse
        # each with the shell its first line names (bash scripts use bash-only syntax; sh is dash here)
        run: |
          for f in install.sh guard/herdr-app $(find mods -name '*.sh'); do
            case "$(head -1 "$f")" in *bash*) bash -n "$f" ;; *) sh -n "$f" ;; esac || { echo "::error file=$f::doesn't parse"; exit 1; }
          done
      - name: tests (repo rules, installer, herdr-task)
        run: python3 -m unittest discover -s test -v
      - name: installer into a brand-new throwaway home (dry run, install, doctor, uninstall)
        run: |
          root=$(mktemp -d)
          ./install.sh --root "$root" --dry-run --yes
          ./install.sh --root "$root" --yes
          python3 bin/shepherdr doctor --root "$root"
          python3 bin/shepherdr uninstall --root "$root"
