# Lists Shepherdr on herdr.dev and lets terminal herdr install it. Shepherdr 2.1 stands alone on herdr-core, so the
# plugin only builds it and runs its own start, stop and status. The id is no longer 2.0's herdr-projects on purpose:
# herdr refuses an update whose id changed, so a 2.0 install isn't moved onto 2.1, which won't start on 2.0's state.
id = "shepherdr"
name = "Shepherdr"
version = "2.1.1"
min_herdr_version = "0.9.0"
description = "Run many coding agents across machines from a phone, tablet or desktop: places, coordinator chats, one agent per task"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/need-bun.sh", "install", "--frozen-lockfile"]

[[build]]
command = ["sh", "scripts/need-bun.sh", "run", "build"]

# One-shot per herdr start: brings Shepherdr up unless it already runs. Needs herdr-core (hc); it refuses, with why, a
# home that still holds 2.0 state.
[[startup]]
command = ["sh", "scripts/need-bun.sh", "server/core/launcher.ts", "start"]

[[actions]]
id = "start"
title = "Start Shepherdr"
contexts = ["workspace"]
command = ["sh", "scripts/need-bun.sh", "server/core/launcher.ts", "start"]

[[actions]]
id = "stop"
title = "Stop Shepherdr"
contexts = ["workspace"]
command = ["sh", "scripts/need-bun.sh", "server/core/launcher.ts", "stop"]

[[actions]]
id = "status"
title = "Shepherdr status"
contexts = ["workspace"]
command = ["sh", "scripts/need-bun.sh", "server/core/launcher.ts", "status"]
