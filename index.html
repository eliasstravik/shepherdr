    <title>Shepherdr</title>
    <meta name="description" content="Run many coding agents across machines from a phone, tablet or desktop." />
    <meta name="theme-color" content="#ffffff" />
    <script>
      /* the appearance picked on this device (src/theme.ts), on the page before the first paint: no flash of the other */
      (function () {
        var a = null
        try { a = localStorage.getItem('shepherdr.appearance') } catch (e) {}
        var dark = a === 'dark' || (a !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.querySelector('meta[name=theme-color]').content = dark ? '#0b0b0d' : '#ffffff'
      })()
    </script>
